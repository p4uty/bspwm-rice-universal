name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # cada lunes: detecta paquetes renombrados en las distros
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -S warning install.sh tests/*.sh

  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:latest", "fedora:43", "debian:12", "debian:13", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar que existen los paquetes de install.sh
        run: bash tests/check-packages.sh

  install:
    # Instalación completa + sesión bspwm en Xvfb (solo a mano o semanalmente, tarda)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, fedora, debian12, debian13, ubuntu2404]
    steps:
      - uses: actions/checkout@v5
      - name: Instalar y probar en contenedor
        run: ENGINE=docker tests/run-tests.sh ${{ matrix.distro }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: resultados-${{ matrix.distro }}
          path: tests/results/${{ matrix.distro }}
